{% extends "base.html" %}
{% block content %}
<div class="flex h-screen bg-gray-100 text-gray-900">
  <!-- Offcanvas Sidebar -->
  <div id="sidebar"
    class="fixed top-0 left-0 w-64 h-full bg-white shadow-lg transform -translate-x-full transition-transform duration-300 z-50">
    <div class="p-6 border-b border-gray-300">
      <h2 class="text-xl font-bold text-blue-600">Extraction Options</h2>
    </div>
    <nav class="flex flex-col p-4 space-y-4">
      <button onclick="showSection('code')" class="text-left px-4 py-2 rounded hover:bg-blue-100 transition">📂 Codebase
        Extraction</button>
      <button onclick="showSection('sql')" class="text-left px-4 py-2 rounded hover:bg-green-100 transition">🛢️ SQL
        Schema Extraction</button>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-white border-b border-gray-300">
      <button onclick="toggleSidebar()" class="text-gray-700 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h1 class="text-xl font-bold text-indigo-700">📊 Extraction Dashboard</h1>
    </header>

    <!-- Code Extraction Form -->
    <section id="code-section" class="p-8">
      <h2 class="text-2xl font-bold mb-4 text-blue-600">Codebase Extraction</h2>
      <form id="extract-form" class="space-y-4">
        <label for="repo_path" class="block font-medium">Local project path:</label>
        <input type="text" id="repo_path" name="repo_path" placeholder="/home/user/myrepo"
          class="w-full bg-white border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <input type="hidden" name="type" value="code">
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded px-4 py-2 font-semibold transition">🔄 Start
          Extraction</button>
      </form>

      <div id="extract-status" class="mt-6">
        <div id="spinner-extract"
          class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin hidden mx-auto"></div>
        <pre id="extract-log"
          class="mt-4 p-4 bg-black text-green-400 border border-gray-700 rounded hidden text-sm overflow-auto max-h-64 font-mono">$ Waiting for extraction...</pre>
        <div id="download-link" class="text-center mt-4 hidden">
          <a href="{{ url_for('extract.extract_downloads', type='code') }}"
            class="bg-green-500 hover:bg-green-400 text-black px-6 py-2 rounded">📥 Download JSONL</a>
        </div>
      </div>
    </section>

    <!-- SQL Extraction Form -->
    <section id="sql-section" class="p-8 hidden">
      <h2 class="text-2xl font-bold mb-4 text-green-600">SQL Schema Extraction</h2>
      <form id="sql-form" class="space-y-4">
        <div class="grid md:grid-cols-2 gap-4">
          <input type="text" id="host" name="host" placeholder="Host (e.g. localhost)"
            class="w-full bg-white border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
          <input type="text" id="port" name="port" placeholder="Port (e.g. 3306)"
            class="w-full bg-white border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
          <input type="text" id="username" name="username" placeholder="Username"
            class="w-full bg-white border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
          <input type="password" id="password" name="password" placeholder="Password"
            class="w-full bg-white border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
          <input type="text" id="database" name="database" placeholder="Database Name"
            class="w-full bg-white border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
          <input type="hidden" name="type" value="sql">
        </div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-500 text-white rounded px-4 py-2 font-semibold transition">🔄
          Extract Schema</button>
      </form>

      <div id="sql-status" class="mt-6">
        <pre id="sql-log"
          class="mt-4 p-4 bg-black text-green-400 border border-gray-700 rounded hidden text-sm overflow-auto max-h-64 font-mono">$ Awaiting connection...</pre>
        <div id="sql-download-link" class="text-center mt-4 hidden">
          <a href="{{ url_for('extract.extract_downloads', type='sql') }}"
            class="bg-green-500 hover:bg-green-400 text-black px-6 py-2 rounded">📥 Download SQL JSONL</a>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  const sidebar = document.getElementById('sidebar');
  const codeSection = document.getElementById('code-section');
  const sqlSection = document.getElementById('sql-section');

  function toggleSidebar() {
    sidebar.classList.toggle('-translate-x-full');
  }

  function showSection(type) {
    codeSection.classList.add('hidden');
    sqlSection.classList.add('hidden');
    if (type === 'code') codeSection.classList.remove('hidden');
    if (type === 'sql') sqlSection.classList.remove('hidden');
    toggleSidebar();
  }

  const form = document.getElementById("extract-form");
  form.addEventListener("submit", async e => {
    e.preventDefault();

    const spinner = document.getElementById("spinner-extract");
    const logEl = document.getElementById("extract-log");
    const downloadLink = document.getElementById("download-link");

    spinner.classList.remove("hidden");
    logEl.classList.remove("hidden");
    logEl.textContent = "$ Starting extraction...\n";
    downloadLink.classList.add("hidden");

    try {
      const response = await fetch("/extract", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(new FormData(form))
      });

      if (!response.ok) {
        throw new Error("Extraction failed: " + response.statusText);
      }

      const data = await response.json();
      logEl.textContent += "$ " + data.message + "\n";
    } catch (err) {
      logEl.textContent += "$ ❌ " + err.message + "\n";
      spinner.classList.add("hidden");
      return;
    }

    // Polling log updates
    const poll = setInterval(async () => {
      const res = await fetch("/extract/logs");
      const { logs } = await res.json();

      logEl.textContent = "$ " + logs.join("\n$ ");

      const isDone = logs.some(l => l.includes("extraction finished") || l.includes("✅ Code extraction finished"));
      const isError = logs.some(l => l.includes("❌"));

      if (isDone || isError) {
        clearInterval(poll);
        spinner.classList.add("hidden");

        if (isDone) {
          downloadLink.classList.remove("hidden");
          logEl.textContent += "\n$ ✅ All done.";
        } else {
          logEl.textContent += "\n$ ❌ An error occurred.";
        }
      }
    }, 500);
  });
  const sqlForm = document.getElementById("sql-form");

  sqlForm.addEventListener("submit", async e => {
    e.preventDefault();

    const logEl = document.getElementById("sql-log");
    logEl.classList.remove("hidden");
    logEl.textContent = "$ Connecting to database...\n";

    const response = await fetch("/extract", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(new FormData(sqlForm))
    });

    const result = await response.json();
    if (result.status === "started") {
      // Start polling for logs
      const pollLogs = setInterval(async () => {
        const logRes = await fetch("/extract/logs");
        const logs = await logRes.text();
        logEl.textContent = logs;

        if (logs.includes("✅") || logs.includes("❌")) {
          clearInterval(pollLogs);
          if (logs.includes("✅")) {
            document.getElementById("sql-download-link").classList.remove("hidden");
          }
        }
      }, 1000);
    } else {
      logEl.textContent += `❌ ${result.message}\n`;
    }
  });

</script>


{% endblock %}
