<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Ever</title>

  <!-- Tailwind + Icons + Font -->
  <script src="/static/js/tailwindcss.js"></script>
  <link rel="stylesheet" href="static/css/css2.css">
  <link rel="stylesheet" href="static/css/font-awesome.css">
  <script src="static/js/jquery-3.7.1.slim.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --grad-a: #7c3aed;
      /* purple */
      --grad-b: #d946ef;
      /* magenta */
      --accent: #8b5cf6;
      --dark-900: #0b1020;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.02) 0%, rgba(255, 255, 255, 0.98) 40%);
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top nav gradient */
    .nav-bg {
      background: linear-gradient(90deg, rgba(124, 58, 237, 0.95), rgba(217, 70, 239, 0.9));
      backdrop-filter: blur(6px);
    }

    .logo-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 1), rgba(79, 70, 229, 1));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.12);
      font-size: 18px;
    }

    /* Desktop nav links */
    .nav-links a {
      color: rgba(255, 255, 255, 0.95);
      transition: transform .15s, color .15s;
    }

    .nav-links a:hover {
      transform: translateY(-3px);
      color: #fff;
    }

    /* Simple utility to constrain main content width */
    .container {
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    /* small nice card shadow used site-wide */
    .card-shadow {
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.08);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), #ffffff);
    }

    /* hero background grid / glow */
    .hero-bg {
      background-image: radial-gradient(ellipse at top left, rgba(138, 92, 246, 0.763), transparent 100%),
        radial-gradient(ellipse at bottom right, rgba(216, 70, 239, 0.63), transparent 100%);
      position: relative;
      overflow: hidden;
    }

    /* responsive tweaks */
    @media (min-width: 1280px) {
      .container {
        max-width: 1400px;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col">
  <!-- NAV -->
  <header class="nav-bg sticky top-0 z-50">
    <div class="container px-6">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-4">
          <a href="/" class="flex items-center gap-3">
            <div class="logo-box"><i class="fa-solid fa-brain"></i></div>
            <div class="text-white font-semibold text-lg leading-none">AI Ever</div>
          </a>

          <nav class="nav-links hidden md:flex items-center gap-6 text-sm font-medium" aria-label="Main navigation">
            <a href="/" class="hover:underline">Home</a>
            <a href="/extract#code" class="">Extract</a>
            <a href="/extract#train" class="">Train</a>
            <a href="/inference" class="" target="_blank">Inference</a>
          </nav>
        </div>

        <div class="flex items-center gap-3">
          <button id="nav-toggle" class="md:hidden p-2 text-white">
            <i class="fa fa-bars"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- mobile menu -->
    <div id="mobile-nav" class="hidden bg-white/5 md:hidden">
      <div class="px-4 py-3 space-y-2 container">
        <a class="block text-white py-2 rounded hover:bg-white/5" href="/">Home</a>
        <a class="block text-white py-2 rounded hover:bg-white/5" href="/extract#code">Extract</a>
        <a class="block text-white py-2 rounded hover:bg-white/5" href="/extract#train">Train</a>
        <a class="block text-white py-2 rounded hover:bg-white/5" href="/inference">Inference</a>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="flex-1">
    <div class=" px-6 py-8">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- FOOTER -->
  <!-- <footer class="border-t mt-8 py-8">
    <div class="container px-6 text-sm text-slate-500">
      © AI Ever · Built with ❤️ · <a href="https://github.com/Suraj99900/AI-EVER"
        class="text-slate-700 hover:underline">Repo</a>
    </div>
  </footer> -->

  <!-- scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // mobile nav toggle
    $('#nav-toggle').on('click', function () { $('#mobile-nav').slideToggle(160); });
    $(window).on('resize', function () { if ($(window).width() >= 768) $('#mobile-nav').hide(); });
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
