<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI Ever</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet"/>
  <style>
    body { font-family:'Inter',sans-serif; }
    .glass { background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); }
  </style>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-50 text-gray-800">

  <!-- Page Container -->
  <div class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="glass sticky top-0 z-50 border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center space-x-2">
          <span class="text-2xl">🧠</span>
          <span class="text-2xl font-bold text-indigo-600">AI Ever</span>
        </a>
        <nav class="hidden md:flex space-x-8 text-gray-600 font-medium">
          <a href="/" class="hover:text-indigo-600 transition">Home</a>
          <a href="/extract#code" class="hover:text-indigo-600 transition">Extract</a>
          <a href="/extract#train" class="hover:text-indigo-600 transition">Train</a>
          <a href="/inference" class="hover:text-indigo-600 transition">Inference</a>
        </nav>
        <button id="nav-toggle" class="md:hidden focus:outline-none">
          <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
      <div id="nav-menu" class="md:hidden hidden bg-white border-t border-gray-200">
        <nav class="flex flex-col px-6 py-4 space-y-1">
          <a href="/" class="py-2 hover:text-indigo-600 transition">Home</a>
          <a href="/extract#code" class="py-2 hover:text-indigo-600 transition">Extract</a>
          <a href="/extract#train" class="py-2 hover:text-indigo-600 transition">Train</a>
          <a href="/inference" class="py-2 hover:text-indigo-600 transition">Inference</a>
          <div class="mt-4 flex space-x-2">
            <a href="/login"
               class="flex-1 text-center py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-500 transition">
              Login
            </a>
            <a href="/signup"
               class="flex-1 text-center py-2 border border-indigo-600 text-indigo-600 rounded-full hover:bg-indigo-50 transition">
              Sign Up
            </a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 bg-white">
      <div class=" mx-auto px-6 py-10">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>

  <script>
    // mobile nav toggle
    document.getElementById('nav-toggle')
      .addEventListener('click', ()=> document.getElementById('nav-menu').classList.toggle('hidden'));
  </script>
</body>
</html>
