<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ever</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Wrapper with soft edges -->
  <div class="min-h-screen rounded-3xl m-4 shadow-2xl overflow-hidden bg-white">

    <!-- Navbar -->
    <header class="w-full border-b border-gray-200 bg-white">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Logo -->
        <a href="/" class="text-xl font-bold text-gray-800">🧠 AI Ever</a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex space-x-6 text-sm font-medium">
          <a href="/" class="text-gray-600 hover:text-black transition">Home</a>
          <a href="#features" class="text-gray-600 hover:text-black transition">Features</a>
          <a href="/about" class="text-gray-600 hover:text-black transition">About</a>
          <a href="/train" class="text-gray-600 hover:text-black transition">Train</a>
          <a href="/inference" class="text-gray-600 hover:text-black transition">Inference</a>
          <a href="/extract" class="text-gray-600 hover:text-black transition">Extract</a>
        </nav>

        <!-- Auth Buttons -->
        <div class="space-x-4">
          <a href="/login" class="bg-black text-white px-4 py-1.5 rounded-full text-sm hover:bg-gray-800 transition">Login</a>
          <a href="/signup" class="bg-white border border-gray-400 text-black px-4 py-1.5 rounded-full text-sm hover:bg-gray-100 transition">Sign Up</a>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="max-w-7xl mx-auto px-6 py-12">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 bg-gray-50">
      <div class="max-w-7xl mx-auto px-6 py-6 text-center text-gray-500 text-sm">
        <p class="mb-2">© 2025 AI Ever. All rights reserved.</p>
        <div class="space-x-4">
          <a href="#" class="hover:text-gray-700">Privacy</a>
          <a href="#" class="hover:text-gray-700">Terms</a>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
